# Committed placeholders. Real values go in secrets.properties (git-ignored) or, in
# CI, in environment variables of the same name.
#
# Bootstrap:
#   cp secrets.defaults.properties secrets.properties
#   then fill in the two values from your Supabase project settings.
SUPABASE_URL=
SUPABASE_ANON_KEY=
# Not a secret: the live website, which the app sends team applications to.
# Point it at `next dev` (e.g. http://10.0.2.2:3000) to test against a local stack.
WEBSITE_URL=https://www.openlibrarykashmir.com
# Play upload key, for signed release builds. Leave empty for an unsigned release build.
# The keystore stays OUTSIDE the repo; OLK_UPLOAD_KEYSTORE is its absolute path.
OLK_UPLOAD_KEYSTORE=
OLK_UPLOAD_KEYSTORE_PASSWORD=
OLK_UPLOAD_KEY_ALIAS=
OLK_UPLOAD_KEY_PASSWORD=
