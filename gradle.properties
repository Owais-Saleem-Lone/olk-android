# JVM settings for the Gradle daemon. 4g suits a modular Compose build; raise if
# you hit OOM on larger machines, lower to 2g on constrained ones.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Build performance.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX is mandatory; the support library is long dead.
android.useAndroidX=true

# Only package the resources the app actually declares.
android.nonTransitiveRClass=true

# Kotlin incremental compilation.
kotlin.incremental=true
